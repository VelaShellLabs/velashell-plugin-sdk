# 契约 SDK 与插件构建支持包的日常验证。发布不走这里(见 release.yml),
# 但**发布会做的事这里基本都做一遍**。
#
# 本仓库产出三个包,共用一个版本号:
#      VelaShell.PluginSdk           契约程序集
#      VelaShell.PluginSdk.Testing   测试替身
#      VelaShell.PluginSdk.Build     插件工程只需引用的那一个包
#                                    (2026-09-11 从 velashell-plugin-cli 搬来)
#
# 与 release.yml 的差别只有三处:不推 nuget.org、不上传产物到 Release、
# 以及 fork PR 拿不到强名称密钥时关掉签名继续跑。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-quality: preview
          dotnet-version: |
            11.0.x
      # 不钉 SDK(仓库没有 global.json),用 runner 上装到的最新 11.0 预览版;把实际版本记进日志备查。
      - name: Show .NET SDK
        run: dotnet --info

      # 复用仓库当前的默认版本:这条路径不推送,不需要编一个 CI 专属版本号。
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $props = Get-Content -Raw Directory.Build.props
          $version = [regex]::Match($props, '<VelaSdkVersion[^>]*>([^<]+)</VelaSdkVersion>').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Could not read VelaSdkVersion from Directory.Build.props"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Validating version $version"

      # 版本号同步体检 —— 「仓库里那几处版本号是否一致」的唯一守门人。
      # release.yml 的 Stamp 步骤只改 runner 上的工作区,不回写仓库,所以漏改只能靠这里显形。
      # 顺带核对「SDK 主版本 == VelaPluginApi.Level」这条纪律。
      # 【为什么 PR 上只提醒、不判红】发布产物**不依赖**仓库当时的版本状态:release.yml 会在
      # runner 上按标签重跑 Set-Version.ps1(见那边的 Stamp 步骤),把全部落点改写一遍。
      # 所以落点漂移伤的是**人**(文档里写着过期版本号、`vela-plugin doctor` 汇报一个错的
      # 宿主 SDK 版本),不是发布正确性 —— 拿仓库卫生问题挡住别人的 PR 不成比例,
      # 何况提 PR 的人多半不是造成漂移的那个。
      #
      # push 到 main/dev 仍然判红:那时仓库确实处在不诚实的状态,而且此刻有能力修它的人
      # 就是刚把代码合进来的那个。
      #
      # 注意这一步还有**另一类**失败:apiLevel 纪律核对(SDK 主版本 == VelaPluginApi.Level)
      # 是 `throw` 而不是 exit code,它会直接终止本步,不走下面这段降级 —— 这是**对的**:
      # 那不是版本号漂移,是"契约破没破"这个判断本身没落到代码里,PR 上就该拦住。
      - name: Version consistency check
        shell: pwsh
        run: |
          & ./scripts/Set-Version.ps1 '${{ steps.version.outputs.version }}' -Check
          # if ($LASTEXITCODE) 而不是 -ne 0:.ps1 不调用 exit 时**不会设置** $LASTEXITCODE,
          # 那时它是 $null —— 而 `$null -ne 0` 为真,会把一次成功判成失败。
          if ($LASTEXITCODE) {
            if ('${{ github.event_name }}' -eq 'pull_request') {
              Write-Host "::warning title=版本号落点不同步::跑 ``pwsh scripts/Set-Version.ps1 <版本>`` 修正。PR 上只提醒,合进 main/dev 后会判红。"
              exit 0
            }
            exit $LASTEXITCODE
          }

      # 来自 fork 的 PR 拿不到仓库机密(GitHub 的既定行为),此时**关掉签名**继续跑 ——
      # 不关的话 CSC 会因为找不到 .snk 直接失败,PR 作者只会看到一条与他改动无关的报错。
      - name: Restore strong-name key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SNK_B64)) {
            Write-Host "::notice::STRONG_NAME_KEY unavailable (fork PR); building without strong-name signing."
            "VELA_SIGN_ARGS=-p:SignAssembly=false" >> $env:GITHUB_ENV
          } else {
            [IO.File]::WriteAllBytes("VelaShell.snk", [Convert]::FromBase64String($env:SNK_B64))
          }
        env:
          SNK_B64: ${{ secrets.STRONG_NAME_KEY }}

      # 必须是 Debug:Release 打开强名签名,而测试程序集不是签名友元。
      - name: Test
        shell: pwsh
        run: |
          dotnet test VelaShell.PluginSdk.slnx -c Debug --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Pack
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force artifacts/nuget | Out-Null
          # VelaShell.PluginSdk.Build 也在这一批里:它与契约包同仓库、同版本、同一次发布
          # (2026-09-11 从 velashell-plugin-cli 搬过来)。顺序无所谓 —— 它对契约包和打包器
          # 都是 ProjectReference,dotnet pack 会自己先把那两个工程建出来。
          # (VelaShell.PluginSdk.Packer 不在这个列表里:它 IsPackable=false,只以构建产物的
          #  形式躺在 .Build 包的 tools/ 下。)
          $projects = @(
            'src/VelaShell.PluginSdk/VelaShell.PluginSdk.csproj',
            'src/VelaShell.PluginSdk.Testing/VelaShell.PluginSdk.Testing.csproj',
            'src/VelaShell.PluginSdk.Build/VelaShell.PluginSdk.Build.csproj'
          )
          foreach ($project in $projects) {
            dotnet pack $project -c Release -o artifacts/nuget -p:VelaSdkVersion=$version --nologo $env:VELA_SIGN_ARGS
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Get-ChildItem artifacts/nuget | Select-Object -ExpandProperty Name

      # 本仓库是 Avalonia 版本锁的**权威**,而这个事实传给**宿主**的唯一通道就是包里那一个
      # buildTransitive props 文件(宿主的 VerifyAvaloniaMatchesSdk 读它)。它没打进包也不会
      # 让 pack 失败,所以拆开核对一遍。
      # (.Build 现在同仓库,直接读 $(VelaAvaloniaVersion),不走这条通道 —— 见其
      #  VerifyAvaloniaVersionPin。所以这一步守的是宿主那一侧。)
      - name: Verify the pin props shipped in the package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $nupkg = "artifacts/nuget/VelaShell.PluginSdk.$version.nupkg"
          if (-not (Test-Path $nupkg)) { throw "Package not found: $nupkg" }
          $work = Join-Path $env:RUNNER_TEMP 'pinprops'
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $work | Out-Null
          # Expand-Archive 只认 .zip 扩展名,.nupkg 直接喂给它会被拒;先复制一份改名。
          $zip = Join-Path $work 'pkg.zip'
          Copy-Item $nupkg $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $work 'x')
          $props = Join-Path $work 'x/buildTransitive/VelaShell.PluginSdk.props'
          if (-not (Test-Path $props)) {
            throw "buildTransitive/VelaShell.PluginSdk.props is missing from the package. The VelaShell host reads the pinned Avalonia version from it; without it the host loses its only consistency check against this SDK."
          }
          $text = Get-Content -Raw $props
          $expected = [regex]::Match((Get-Content -Raw Directory.Build.props), '<VelaAvaloniaVersion>([^<]+)</VelaAvaloniaVersion>').Groups[1].Value
          $shipped = [regex]::Match($text, '<VelaSdkPinnedAvaloniaVersion>([^<]+)</VelaSdkPinnedAvaloniaVersion>').Groups[1].Value
          if ($shipped -ne $expected) {
            throw "Package ships VelaSdkPinnedAvaloniaVersion '$shipped' but Directory.Build.props says '$expected'."
          }
          Write-Host "Pinned Avalonia = $shipped, SDK package version = $version"
          Write-Host $text

      # 端到端冒烟:拿刚打出的包,站在插件作者的位置上走一遍
      # (最小插件工程 → 还原 → 构建 → 出 .vpx → 读回容器 → 查共享程序集有没有漏)。
      # 夹具在 tests/smoke/,细节见 scripts/Invoke-Smoke.ps1 的注释。
      #
      # 这一步不是形式,它挡两类东西:
      #  ① 插件工程是**仓库外环境**,仓库内的 Directory.Build.props 一条也吃不到 ——
      #     历史上两个最难查的坑(CA2252 全线报错、AXAML 编译器到不了插件工程)
      #     都只有在这个前提下才会显形;
      #  ② 打包器(VelaShell.PluginSdk.Packer)真的进了包、targets 真的调得动它 ——
      #     "随包分发、无需全局工具"是本包对插件作者的承诺,而漏打或调错了只有真跑一遍
      #     才看得见(插件作者那边的现象是一句 VELA1003 或构建到一半 Exec 失败)。
      #     改 targets 或改打包器命令面之后必跑。
      - name: Smoke test (plugin project -> build -> .vpx)
        shell: pwsh
        run: |
          & ./scripts/Invoke-Smoke.ps1 -Feed ./artifacts/nuget -Version '${{ steps.version.outputs.version }}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nuget/*
          if-no-files-found: error
