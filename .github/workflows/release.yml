# 契约 SDK 的发布流水线:在 GitHub 页面**发布 Release** 时自动触发。
#
# 一次发布产出两个 NuGet 包,共用 Release 标签里的那个版本号:
#
#      VelaShell.PluginSdk           契约程序集(插件与宿主唯一共享的类型)
#      VelaShell.PluginSdk.Testing   测试替身(TestPluginContext 与各能力内存实现)
#
# **其余三个包不在这里发**(2026-08-27 拆库起):
#      VelaShell.Plugin.Cli / VelaShell.PluginSdk.Build … joesdu/velashell-plugin-cli
#      VelaShell.Plugin.Templates ………………………………… joesdu/velashell-plugin-templates
# 那两个仓库有自己的版本号与自己的 Release 流水线。本仓库发 1.6.0 **不要求**它们跟着发;
# 它们只在想吃到新契约时才把自己引用的 VelaShell.PluginSdk 版本抬上来。
#
# 📌 版本号:**发版前在本地落好、随功能改动一起合进 main**。
#    跑一次 `pwsh scripts/Set-Version.ps1 <版本>`,它会把该版本写进 Directory.Build.props、
#    VelaPluginApi.SdkVersion 与两份 sdk-reference 的版本横幅 —— 四处。所以发版三步:
#      ① 破坏性变更才需要先手工 +1 VelaPluginApi.Level(改没改是人的判断,脚本会核对但不代改)
#      ② 本地跑 Set-Version.ps1,连同功能改动一起合进 main
#      ③ 在 GitHub 上发 Release,标签填 v<版本>
#
#    下面的 Stamp 步骤只改 runner 上的工作区,**不回写仓库**:产物版本号因此永远等于
#    Release 标签,与仓库里当时提交了什么无关。忘了第 ② 步的兜底是 CI 的版本同步体检。
#
# ⚠️ Avalonia 版本锁:本仓库是整个插件生态里这个版本号的**权威**。改 VelaAvaloniaVersion
#    等于改插件生态的 Avalonia 版本 —— 必须与宿主同一波发布,并且发完之后让
#    velashell-plugin-cli 抬一次它引用的 SDK 版本,否则它那道 VerifyAvaloniaVersionPin 会红。
#
# 推送用 **NuGet Trusted Publishing(OIDC)**,不存 API Key:
#   NuGet/login 拿本次运行的 GitHub OIDC 令牌去 nuget.org 换一把**短时效**的推送密钥,
#   用完即弃。密钥不落仓库机密,也就没有"泄漏了要轮换"这件事。
#   ⚠️ 首次发版前必须在 nuget.org 上为**这两个包**各建一条可信发布策略,三项都填新值:
#        Repository owner  VelaShellLabs
#        Repository        velashell-plugin-sdk
#        Workflow file     release.yml
#      建法见 docs/release-process.md 的「NuGet 可信发布」一节。
#
# 需要的仓库机密:
#   STRONG_NAME_KEY   与 VelaShell 主仓库**同一把**:Release 下 SDK 程序集要强名称签名,
#                     否则宿主(已签名)引用不了它。这是本流水线**唯一**需要的机密。
name: Release

on:
  release:
    types: [published]
  # 手动兜底:release 事件没能触发时,在 Actions 页面选本工作流 → Run workflow → 填标签即可补跑。
  # 推送用 --skip-duplicate,对同一标签重复跑是幂等的。
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 Release 标签(如 v1.6.0)'
        required: true
        type: string
      dryRun:
        description: '只打包与核对,不推送 nuget.org'
        required: false
        default: false
        type: boolean

permissions:
  # 只读即可:本流水线不上传 Release 资产、也不回写版本号。
  contents: read
  # Trusted Publishing 的前提:没有它,NuGet/login 拿不到 OIDC 令牌,换密钥这一步会直接失败。
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name || inputs.tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) { Write-Error "No release tag available."; exit 1 }
          $version = $tag.TrimStart('v')
          # 版本号必须是合法 SemVer:打错标签(比如 "release-2")的话,包会以一个谁也想不到的
          # 版本号推上 nuget.org,而 nuget.org 的包版本**不可删除、不可覆盖**。
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Release tag '$tag' does not resolve to a SemVer version (got '$version'). Use e.g. v1.6.0 or v1.6.0-preview.1."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing version $version (tag $tag)"

      # 放在**构建之前的第一步**,产物因此永远与 Release 标签一致。
      # 正常路径上这一步是空操作(版本号已经在 main 里了)。
      # ⚠️ 只改工作区,**不回写仓库**:main 若真的落后了,下面 `git diff --stat` 会把它打出来,
      #    同时 main 上的 CI 版本同步体检也会红 —— 照它给的命令本地补一个 PR。
      - name: Stamp version into the repo
        shell: pwsh
        run: |
          & ./scripts/Set-Version.ps1 '${{ steps.version.outputs.version }}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git --no-pager diff --stat

      # 强名称密钥。缺了它 Release 构建会在 CSC 那一步失败(找不到 .snk),
      # 而那条报错离根因很远 —— 这里先给一句人话。
      - name: Restore strong-name key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SNK_B64)) {
            Write-Error "STRONG_NAME_KEY secret is missing; SDK assemblies must be strong-name signed with the same key as the VelaShell host."
            exit 1
          }
          [IO.File]::WriteAllBytes("VelaShell.snk", [Convert]::FromBase64String($env:SNK_B64))
        env:
          SNK_B64: ${{ secrets.STRONG_NAME_KEY }}

      # ⚠️ 必须是 Debug,别改成 Release:Release 会打开强名签名(见 src/Directory.Build.props),
      #    而签名程序集的 InternalsVisibleTo 必须带友元公钥、友元也得用同一把钥匙签名 ——
      #    测试程序集两条都不满足。这些用例验的是契约,与优化级别无关,Debug 等价。
      - name: Test
        shell: pwsh
        run: |
          dotnet test VelaShell.PluginSdk.slnx -c Debug --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Pack
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force artifacts/nuget | Out-Null
          $projects = @(
            'src/VelaShell.PluginSdk/VelaShell.PluginSdk.csproj',
            'src/VelaShell.PluginSdk.Testing/VelaShell.PluginSdk.Testing.csproj'
          )
          foreach ($project in $projects) {
            dotnet pack $project -c Release -o artifacts/nuget -p:VelaSdkVersion=$version --nologo
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Get-ChildItem artifacts/nuget | Select-Object -ExpandProperty Name

      # 拆库之后,包里的 buildTransitive props 是 Avalonia 版本锁传给下游的**唯一通道**
      # (宿主的 VerifyAvaloniaMatchesSdk、cli 仓库的 VerifyAvaloniaVersionPin 都读它)。
      # 它没打进包也不会让 pack 失败,所以在推之前拆开核对一遍。
      - name: Verify the pin props shipped in the package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $nupkg = "artifacts/nuget/VelaShell.PluginSdk.$version.nupkg"
          if (-not (Test-Path $nupkg)) { throw "Package not found: $nupkg" }
          $work = Join-Path $env:RUNNER_TEMP 'pinprops'
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $work | Out-Null
          # Expand-Archive 只认 .zip 扩展名,.nupkg 直接喂给它会被拒;先复制一份改名。
          $zip = Join-Path $work 'pkg.zip'
          Copy-Item $nupkg $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $work 'x')
          $props = Join-Path $work 'x/buildTransitive/VelaShell.PluginSdk.props'
          if (-not (Test-Path $props)) {
            throw "buildTransitive/VelaShell.PluginSdk.props is missing from the package. Downstream repos read the pinned Avalonia version from it; without it the host and VelaShell.PluginSdk.Build lose their only cross-repo consistency check."
          }
          $text = Get-Content -Raw $props
          $expected = [regex]::Match((Get-Content -Raw Directory.Build.props), '<VelaAvaloniaVersion>([^<]+)</VelaAvaloniaVersion>').Groups[1].Value
          $shipped = [regex]::Match($text, '<VelaSdkPinnedAvaloniaVersion>([^<]+)</VelaSdkPinnedAvaloniaVersion>').Groups[1].Value
          if ($shipped -ne $expected) {
            throw "Package ships VelaSdkPinnedAvaloniaVersion '$shipped' but Directory.Build.props says '$expected'."
          }
          Write-Host "Pinned Avalonia = $shipped, SDK package version = $version"
          Write-Host $text

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nuget/*
          if-no-files-found: error

      # Trusted Publishing:用本次运行的 OIDC 身份换一把短时效推送密钥。
      # 换不到密钥基本只有一个原因 —— nuget.org 上那条策略的 Repository / Workflow 字段
      # 与本仓库对不上。详见 docs/release-process.md。
      - name: NuGet login (trusted publishing)
        id: nuget-login
        if: ${{ !inputs.dryRun }}
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'joes_du' }}

      - name: Push to nuget.org
        if: ${{ !inputs.dryRun }}
        shell: pwsh
        run: |
          # --skip-duplicate:同一版本重跑不算失败(手动补跑是常规操作)。
          # .snupkg 与同名 .nupkg 在同一目录时由 dotnet nuget push 顺带一并推送,无需单列。
          #
          # ⚠️ 通配符必须自己展开:dotnet nuget push **不做 glob 扩展**,把
          #    "artifacts/nuget/*.nupkg" 整个当成文件名去找,报 "File does not exist"。
          $packages = @(Get-ChildItem artifacts/nuget/*.nupkg)
          if ($packages.Count -eq 0) { throw "No .nupkg found in artifacts/nuget." }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_TOKEN --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
        env:
          NUGET_TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
